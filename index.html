<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program Tree</title>
</head>
<body>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#eef0f6; --surface-3:#e4e7f0;
  --ink:#161a2b; --ink-soft:#4d5568; --ink-faint:#8790a3;
  --border:#dde1ea; --border-soft:#e9ecf3;
  --cs:#2455eb; --cs-soft:#e8edfe;
  --ai:#7c3aed; --ai-soft:#f1e9fe;
  --cyb:#b45a0a; --cyb-soft:#fbebd9;
  --ai-old:#5b6b8c; --ai-old-soft:#e9ebf2;
  --cs-old:#0f766e; --cs-old-soft:#e3f3f1;
  --cyb-old:#9c3b4a; --cyb-old-soft:#f7e7ea;
  --is:#15803d; --is-soft:#e3f5e8;
  --is-new:#c2185b; --is-new-soft:#fbe4ee;
  --dept-cs:#1f2a5c; --dept-cs-soft:#e7e9f4;
  --dept-cis:#5c3a1f; --dept-cis-soft:#f4ece2;
  --nis:#0e7490; --nis-soft:#e0f2f7;
  --dept-nis:#0e4f63; --dept-nis-soft:#dff0f5;
  --good:#166a45; --good-soft:#e1f3ea;
  --elective:#8a5a00; --elective-soft:#fbf0d9;
  --shadow: 0 1px 2px rgba(20,24,40,.04), 0 8px 24px -12px rgba(20,24,40,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1120; --surface:#161a2e; --surface-2:#1d2238; --surface-3:#262c46;
    --ink:#eef0fa; --ink-soft:#a7adc4; --ink-faint:#6b7391;
    --border:#2a3050; --border-soft:#232849;
    --cs:#7d97ff; --cs-soft:#1c2550;
    --ai:#c1a0ff; --ai-soft:#2a2050;
    --cyb:#f0a860; --cyb-soft:#3a2712;
    --ai-old:#9aa8c9; --ai-old-soft:#252a3d;
    --cs-old:#5fd4c4; --cs-old-soft:#123330;
    --cyb-old:#e893a0; --cyb-old-soft:#3a1d22;
    --is:#6fdb95; --is-soft:#123822;
    --is-new:#ff7bac; --is-new-soft:#3a1830;
    --dept-cs:#aab4ec; --dept-cs-soft:#1c2550;
    --dept-cis:#e8c39c; --dept-cis-soft:#3a2712;
    --nis:#5cc8e0; --nis-soft:#12333d;
    --dept-nis:#9fdcec; --dept-nis-soft:#12333d;
    --good:#6fd6a8; --good-soft:#123a2a;
    --elective:#e8c467; --elective-soft:#3a2f0f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#161a2e; --surface-2:#1d2238; --surface-3:#262c46;
  --ink:#eef0fa; --ink-soft:#a7adc4; --ink-faint:#6b7391;
  --border:#2a3050; --border-soft:#232849;
  --cs:#7d97ff; --cs-soft:#1c2550;
  --ai:#c1a0ff; --ai-soft:#2a2050;
  --cyb:#f0a860; --cyb-soft:#3a2712;
  --ai-old:#9aa8c9; --ai-old-soft:#252a3d;
  --cs-old:#5fd4c4; --cs-old-soft:#123330;
  --cyb-old:#e893a0; --cyb-old-soft:#3a1d22;
  --is:#6fdb95; --is-soft:#123822;
  --is-new:#ff7bac; --is-new-soft:#3a1830;
  --dept-cs:#aab4ec; --dept-cs-soft:#1c2550;
  --dept-cis:#e8c39c; --dept-cis-soft:#3a2712;
  --nis:#5cc8e0; --nis-soft:#12333d;
  --dept-nis:#9fdcec; --dept-nis-soft:#12333d;
  --good:#6fd6a8; --good-soft:#123a2a;
  --elective:#e8c467; --elective-soft:#3a2f0f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  padding-inline:16px;
}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,'Times New Roman',serif;}
code,.mono,.code{font-family:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;}
h1,h2,h3{text-wrap:balance; margin:0;}
a{color:inherit}
button{font-family:inherit}
::selection{background:var(--cs-soft)}

.wrap{max-width:1080px; margin:0 auto; padding-block:28px 64px;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-bottom:28px;
}
.brand{display:flex; align-items:center; gap:16px; cursor:pointer; min-width:0;}
.brand-mark{
  width:34px; height:34px; border-radius:9px; flex:none;
  background:linear-gradient(155deg, var(--cs), var(--ai) 55%, var(--cyb));
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow);
}
.brand-mark svg{width:18px; height:18px;}
.brand-text{display:flex; flex-direction:column; line-height:1.15; min-width:0;}
.brand-text b{font-family:'Fraunces',serif; font-size:16px; letter-spacing:.1px;}
.brand-text span{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.09em;}
.brand-mark.logo-plate{
  background:#ffffff; border:1px solid var(--border); box-shadow:var(--shadow);
  padding:9px 16px; width:auto; height:64px; display:flex; align-items:center; justify-content:center;
  border-radius:13px;
}
.brand-mark.logo-plate img{height:100%; width:auto; display:block;}
.brand-text .brand-uni{
  font-size:13px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.11em; font-weight:700;
  margin-bottom:2px;
}
.brand-text .brand-college{
  font-family:'Fraunces',serif; font-size:25px; font-weight:700; letter-spacing:.05px; line-height:1.2;
  max-width:520px;
}
@media (max-width:900px){
  .brand-text .brand-college{font-size:19px; max-width:340px;}
}
@media (max-width:640px){
  .topbar{align-items:flex-start;}
  .brand-mark.logo-plate{height:48px; padding:6px 11px;}
  .brand-text .brand-college{font-size:15.5px; max-width:200px;}
  .brand-text .brand-uni{font-size:10.5px;}
}

.theme-toggle{
  border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
  border-radius:100px; padding:7px 13px; font-size:12.5px; cursor:pointer;
  display:flex; align-items:center; gap:6px;
}
.theme-toggle:hover{color:var(--ink); border-color:var(--ink-faint)}

.crumbs{
  display:flex; align-items:center; flex-wrap:wrap; gap:6px;
  font-size:13px; color:var(--ink-faint); margin-bottom:18px;
}
.crumbs button{
  background:none; border:none; color:var(--ink-soft); cursor:pointer; padding:3px 2px;
  font-size:13px; border-radius:5px;
}
.crumbs button:hover{color:var(--ink); text-decoration:underline;}
.crumbs .sep{opacity:.5}
.crumbs .current{color:var(--ink); font-weight:600;}

/* ---------- Home ---------- */
.hero{margin-bottom:30px; text-align:center;}
.eyebrow{
  display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint);
  margin-bottom:12px;
}
.eyebrow::before{content:""; width:16px; height:1.5px; background:var(--ink-faint); display:inline-block;}
.hero h1{font-size:clamp(19px,2.6vw,25px); font-weight:600; margin:0 auto 10px; max-width:34ch;}
.hero-credit{
  font-size:11.5px; color:var(--ink-faint); letter-spacing:.03em; font-style:italic;
}
.hero p{color:var(--ink-soft); font-size:15.5px; max-width:56ch; line-height:1.6;}

.dept-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:24px;}
@media (max-width:720px){.dept-grid{grid-template-columns:1fr;}}

.dept-card{
  border:1px solid var(--border); border-radius:16px; background:var(--surface);
  padding:22px 22px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.dept-card::before{
  content:""; position:absolute; inset:0 0 auto 0; height:4px;
}
.dept-card.cs-dept::before{background:linear-gradient(90deg,var(--cs),var(--ai));}
.dept-card.cis-dept::before{background:var(--cyb);}
.dept-card.nis-dept::before{background:linear-gradient(90deg,var(--nis),var(--cs));}
.dept-grid .dept-card.nis-dept{grid-column:1 / -1;}
.dept-card .dept-kicker{
  font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;
  color:var(--ink-faint); margin-bottom:6px;
}
.dept-card h2{font-size:19px; font-weight:600; margin-bottom:6px;}
.dept-card .dept-desc{font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin-bottom:16px;}
.prog-list{display:flex; flex-direction:column; gap:9px;}
.prog-row{
  display:flex; align-items:center; gap:12px; padding:12px 13px; border-radius:11px;
  border:1px solid var(--border-soft); background:var(--surface-2); cursor:pointer;
  transition:border-color .12s, transform .12s;
  text-align:left; width:100%; color:var(--ink);
}
.prog-row:hover{border-color:var(--ink-faint); transform:translateX(2px);}
.prog-swatch{width:9px; height:9px; border-radius:50%; flex:none;}
.prog-row .prog-name{font-weight:600; font-size:14.5px; flex:1;}
.prog-row .prog-meta{font-size:12px; color:var(--ink-faint); white-space:nowrap;}
.prog-row .arrow{color:var(--ink-faint); font-size:15px;}

.prog-select-row{display:flex; gap:10px; flex-wrap:wrap; align-items:stretch;}
.prog-select-row .select-wrap{flex:1; min-width:200px;}
.go-btn{
  display:inline-flex; align-items:center; gap:8px; border:none; border-radius:10px;
  padding:0 18px; font-size:13.5px; font-weight:700; color:#fff; cursor:pointer; white-space:nowrap;
  background:var(--dept-accent, var(--cs));
}
.go-btn:hover{filter:brightness(1.07);}
.cs-dept .go-btn{background:linear-gradient(120deg, var(--cs), var(--ai));}
.cis-dept .go-btn{background:var(--cyb);}
.nis-dept .go-btn{background:var(--nis);}
.go-btn[disabled]{opacity:.45; cursor:not-allowed; filter:none;}
.soon-note{
  font-size:13px; color:var(--ink-faint); border:1px dashed var(--border); background:var(--surface-2);
  border-radius:11px; padding:13px 14px; line-height:1.5;
}

.switch-row{
  display:flex; align-items:center; justify-content:flex-end; gap:10px; margin:-8px 0 18px; flex-wrap:wrap;
}
.switch-row .switch-label{font-size:12px; color:var(--ink-faint); white-space:nowrap;}
.switch-select-wrap{min-width:260px;}
.switch-select-wrap select{font-size:13px; padding:9px 32px 9px 13px;}

.level-course-grid{display:flex; flex-direction:column; gap:8px; margin-top:2px;}

.stat-strip{
  display:flex; gap:22px; flex-wrap:wrap; margin-top:30px; padding-top:22px;
  border-top:1px solid var(--border-soft);
}
.stat{min-width:110px;}
.stat b{font-family:'Fraunces',serif; font-size:24px; display:block; font-variant-numeric:tabular-nums;}
.stat span{font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em;}

/* ---------- Program workspace ---------- */
.prog-header{
  display:flex; align-items:flex-start; justify-content:space-between; gap:18px;
  padding:20px 22px; border-radius:16px; margin-bottom:20px; border:1px solid var(--border);
  background:var(--surface); box-shadow:var(--shadow);
}
.prog-header .ph-left{display:flex; gap:14px; align-items:flex-start;}
.prog-icon{
  width:42px; height:42px; border-radius:11px; flex:none;
  display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif;
  font-weight:600; font-size:15px; color:#fff;
}
.prog-header h1{font-size:22px; font-weight:600;}
.prog-header .prog-degree{font-size:13px; color:var(--ink-faint); margin-top:3px;}
.dept-pill{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:5px 10px;
  border-radius:100px; border:1px solid var(--border); color:var(--ink-soft); margin-top:9px;
}
.ph-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none;}
.ph-right .cr-total{font-family:'Fraunces',serif; font-size:22px; font-variant-numeric:tabular-nums;}
.ph-right .cr-label{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em;}

.tabrail{display:flex; gap:8px; margin-bottom:20px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.tab-btn{
  background:none; border:none; padding:10px 4px; margin-right:14px; cursor:pointer;
  font-size:14px; color:var(--ink-faint); font-weight:600; position:relative; top:1px;
  border-bottom:2px solid transparent;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--ink); border-bottom-color:var(--accent-now,var(--cs));}

.panel{display:none;}
.panel.active{display:block;}

/* full plan table */
.plan-controls{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.search-box{
  flex:1; min-width:180px; display:flex; align-items:center; gap:8px;
  border:1px solid var(--border); background:var(--surface); border-radius:10px;
  padding:9px 12px;
}
.search-box input{
  border:none; outline:none; background:none; color:var(--ink); font-size:13.5px; width:100%;
}
.search-box svg{flex:none; opacity:.5}
.chip-filter{display:flex; gap:6px; flex-wrap:wrap;}
.chip{
  border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
  border-radius:100px; padding:7px 12px; font-size:12.5px; cursor:pointer;
}
.chip.active{background:var(--surface-3); color:var(--ink); border-color:var(--ink-faint); font-weight:600;}

.table-wrap{border:1px solid var(--border); border-radius:14px; overflow-x:auto; background:var(--surface); box-shadow:var(--shadow);}
table{border-collapse:collapse; width:100%; min-width:660px;}
thead th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-faint); padding:12px 14px; border-bottom:1px solid var(--border);
  background:var(--surface-2); position:sticky; top:0;
}
tbody td{padding:11px 14px; border-bottom:1px solid var(--border-soft); font-size:13.5px; vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
td.code{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px; white-space:nowrap;}
td.credits{font-variant-numeric:tabular-nums; text-align:center; white-space:nowrap;}
.lvl-badge{
  display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
  border-radius:6px; background:var(--surface-3); font-size:11.5px; font-weight:700;
  font-variant-numeric:tabular-nums;
}
.req-tag{
  display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.03em; padding:3px 8px;
  border-radius:100px; text-transform:uppercase;
}
.req-tag.req{background:var(--good-soft); color:var(--good);}
.req-tag.elec{background:var(--elective-soft); color:var(--elective);}
.prereq-cell{color:var(--ink-soft); font-size:12.5px;}
.prereq-code{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; background:var(--surface-3);
  padding:2px 6px; border-radius:5px; margin:1px 3px 1px 0; display:inline-block; cursor:pointer;
  border:1px solid var(--border);
}
.prereq-code:hover{border-color:var(--ink-faint);}
.dash{color:var(--ink-faint);}
.empty-row td{text-align:center; color:var(--ink-faint); padding:40px 14px; font-size:13.5px;}

/* levels view */
.level-list{display:flex; flex-direction:column; gap:12px;}
.level-card{border:1px solid var(--border); border-radius:14px; background:var(--surface); box-shadow:var(--shadow); overflow:hidden;}
.level-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 18px; cursor:pointer; width:100%; background:none; border:none; text-align:left; color:var(--ink);
}
.level-head .lh-left{display:flex; align-items:center; gap:12px;}
.level-num{
  font-family:'Fraunces',serif; font-size:16px; font-weight:600; width:38px; height:38px;
  border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; flex:none;
}
.level-head h3{font-size:15px; font-weight:600;}
.level-head .lh-sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
.chevron{transition:transform .15s; color:var(--ink-faint); flex:none;}
.level-card.open .chevron{transform:rotate(180deg);}
.level-body{display:none; padding:0 18px 16px;}
.level-card.open .level-body{display:block;}
.course-pill{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  background:var(--surface-2); margin-bottom:7px; border:1px solid var(--border-soft);
}
.course-pill:last-child{margin-bottom:0;}
.course-pill .cp-code{font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; min-width:64px;}
.course-pill .cp-title{flex:1; font-size:13.5px;}
.course-pill .cp-cr{font-size:12px; color:var(--ink-faint); font-variant-numeric:tabular-nums; white-space:nowrap;}

/* prereq finder */
.finder-shell{
  border:1px solid var(--border); border-radius:16px; background:var(--surface); box-shadow:var(--shadow);
  padding:22px;
}
.finder-select-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
.select-wrap{position:relative; flex:1; min-width:240px;}
.select-wrap select{
  width:100%; appearance:none; border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
  border-radius:10px; padding:11px 34px 11px 13px; font-size:13.5px; cursor:pointer;
}
.select-wrap::after{
  content:"⌄"; position:absolute; right:13px; top:50%; transform:translateY(-55%); color:var(--ink-faint); pointer-events:none;
}
.finder-hint{font-size:12px; color:var(--ink-faint); margin-bottom:18px;}
.result-card{border-top:1px solid var(--border-soft); padding-top:18px; margin-top:16px;}
.result-title-row{display:flex; align-items:flex-start; gap:12px; justify-content:space-between; flex-wrap:wrap; margin-bottom:14px;}
.result-title-row .rt-name{font-size:18px; font-weight:600; font-family:'Fraunces',serif;}
.result-title-row .rt-code{font-family:'IBM Plex Mono',monospace; color:var(--ink-faint); font-size:13px; margin-top:2px;}
.result-meta{display:flex; gap:8px; flex-wrap:wrap;}
.meta-tag{font-size:11.5px; border:1px solid var(--border); border-radius:100px; padding:5px 10px; color:var(--ink-soft);}

.prereq-block{margin-top:6px;}
.prereq-block h4{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin-bottom:10px; font-weight:700;}
.prereq-chain{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.chain-node{
  border:1px solid var(--border); border-radius:12px; padding:11px 14px; background:var(--surface-2);
  min-width:150px;
}
.chain-node.self{border-color:var(--accent-now,var(--cs)); background:var(--surface);}
.chain-node .cn-code{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px;}
.chain-node .cn-title{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.chain-arrow{color:var(--ink-faint); font-size:16px; flex:none;}
.no-prereq{
  border:1px dashed var(--border); border-radius:12px; padding:14px; color:var(--ink-soft); font-size:13.5px;
  background:var(--surface-2);
}
.unlocks-row{display:flex; flex-wrap:wrap; gap:8px;}
.unlock-chip{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; border:1px solid var(--border);
  border-radius:100px; padding:5px 11px; background:var(--surface-2); cursor:pointer;
}
.unlock-chip:hover{border-color:var(--ink-faint);}

/* ---- curriculum map ---- */
.map-shell{
  border:1px solid var(--border); border-radius:16px; background:var(--surface); box-shadow:var(--shadow);
  padding:20px;
}
.map-toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
.map-toolbar .select-wrap{flex:1; min-width:220px;}
.map-clear-btn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft); border-radius:10px;
  padding:0 16px; height:40px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.map-clear-btn:hover{color:var(--ink); border-color:var(--ink-faint);}
.map-legend{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; font-size:11.5px; color:var(--ink-soft);}
.map-legend span{display:inline-flex; align-items:center; gap:6px;}
.map-legend i{width:10px; height:10px; border-radius:50%; display:inline-block; flex:none;}
.map-scroll{overflow-x:auto; border-radius:12px; padding-bottom:6px;}
.map-canvas{position:relative;}
.map-col-label{
  position:absolute; top:0; font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-faint); text-align:center;
}
.map-node{
  position:absolute; border-radius:10px; border:1px solid var(--border); background:var(--surface-2);
  padding:6px 9px; cursor:pointer; overflow:hidden; box-sizing:border-box;
  transition:opacity .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
}
.map-node:hover{border-color:var(--ink-faint);}
.map-node .mn-code{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:11px;}
.map-node .mn-title{
  font-size:9.5px; color:var(--ink-faint); line-height:1.25; margin-top:3px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.map-node.selected{
  border-color:var(--accent-now,var(--cs)); background:var(--surface);
  box-shadow:0 0 0 2px var(--accent-now,var(--cs)) inset;
}
.map-node.upstream{border-color:var(--cs); box-shadow:0 0 0 1px var(--cs) inset;}
.map-node.downstream{border-color:var(--cyb); box-shadow:0 0 0 1px var(--cyb) inset;}
.map-node.dimmed{opacity:.25;}
.map-svg{position:absolute; top:0; left:0; pointer-events:none;}
.map-edge{fill:none; stroke:var(--border); stroke-width:1.4;}
.map-edge.upstream{stroke:var(--cs); stroke-width:2.2;}
.map-edge.downstream{stroke:var(--cyb); stroke-width:2.2;}
.map-edge.dimmed{opacity:.12;}

footer.foot{margin-top:44px; padding-top:18px; border-top:1px solid var(--border-soft); font-size:11.5px; color:var(--ink-faint); text-align:center;}

/* ============================= AUTH & ADMIN ============================= */
:root{ --on-accent:#ffffff; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --on-accent:#0e1120; } }
:root[data-theme="dark"]{ --on-accent:#0e1120; }

.top-actions{display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap;}
.userbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
.u-chip{
  display:flex; align-items:center; gap:9px; border:1px solid var(--border); background:var(--surface);
  border-radius:100px; padding:4px 14px 4px 4px; min-width:0;
}
.u-av{
  width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; background:var(--cs); color:var(--on-accent);
}
.u-av.admin{background:var(--ai);}
.u-meta{display:flex; flex-direction:column; line-height:1.15; min-width:0;}
.u-meta b{font-size:12.5px; font-weight:600; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.u-meta i{font-style:normal; font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.07em;}
.theme-toggle:focus-visible, .btn:focus-visible, .linkbtn:focus-visible, .auth-tab:focus-visible,
.fld input:focus-visible, .fld select:focus-visible, .act:focus-visible{outline:2px solid var(--cs); outline-offset:2px;}
@media (max-width:640px){
  .u-chip{padding:4px 12px 4px 4px;}
  .u-meta b{max-width:120px;}
  .topbar{flex-wrap:wrap;}
  .top-actions{width:100%; justify-content:flex-start;}
  .userbar{justify-content:flex-start;}
  .prog-header.adm-head{flex-direction:column;}
  .prog-header.adm-head .ph-right{flex-direction:row; align-items:baseline; gap:10px;}
}

/* ---------- shared bits ---------- */
.bi > span{display:block;}
.bi > .ar{font-size:.94em; opacity:.88; margin-top:2px;}
.lbl .ar{margin-left:8px; color:var(--ink-faint); font-weight:500;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--ink); border-radius:10px; padding:10px 16px; font-size:13.5px;
  font-weight:700; cursor:pointer; min-height:42px;
}
.btn:hover{border-color:var(--ink-faint);}
.btn.primary{background:var(--cs); border-color:var(--cs); color:var(--on-accent);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger{background:var(--cyb-old); border-color:var(--cyb-old); color:var(--on-accent);}
.btn.block{width:100%;}
.btn[disabled]{opacity:.5; cursor:not-allowed; filter:none;}
.linkbtn{background:none; border:none; color:var(--ink-soft); font-size:12.5px; cursor:pointer; padding:6px 2px; text-decoration:underline; text-underline-offset:3px;}
.linkbtn:hover{color:var(--ink);}
.linkbtn[disabled]{opacity:.5; cursor:not-allowed; text-decoration:none;}

.msg{border:1px solid var(--border); border-radius:11px; padding:11px 13px; font-size:13px; line-height:1.5; margin:14px 0; color:var(--ink);}
.msg.err{background:var(--cyb-old-soft); border-color:var(--cyb-old);}
.msg.warn{background:var(--elective-soft); border-color:var(--elective);}
.msg.ok{background:var(--good-soft); border-color:var(--good);}
.msg.info{background:var(--cs-soft); border-color:var(--cs);}
.msg.demo{background:var(--surface-2); border-style:dashed;}
.msg .demo-code{display:block; margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:22px; letter-spacing:.3em; font-weight:700;}

.fld{display:block; margin-bottom:14px;}
.fld > .lbl{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--ink-soft);}
.fld input, .fld select{
  width:100%; border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
  border-radius:10px; padding:11px 13px; font-size:14px; font-family:inherit; min-height:44px;
}
.fld input:focus, .fld select:focus{border-color:var(--cs);}
.fld .hint{display:block; font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
.fld input.otp{font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:.45em; text-align:center; font-weight:600;}
.pw-row{display:flex; gap:8px;}
.pw-row input{flex:1; min-width:0;}
.pw-row .btn{padding:0 13px; min-height:44px; font-size:12.5px;}

/* ---------- login ---------- */
.auth-shell{display:flex; justify-content:center; padding:18px 0 10px;}
.auth-card{
  width:100%; max-width:460px; border:1px solid var(--border); background:var(--surface);
  border-radius:18px; box-shadow:var(--shadow); padding:26px 24px 22px; position:relative; overflow:hidden;
}
.auth-card::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--cs),var(--ai),var(--cyb));}
.auth-head h1{font-size:22px; font-weight:600; margin-bottom:4px;}
.auth-head p{font-size:13px; color:var(--ink-faint); margin:0 0 18px; line-height:1.5;}
.auth-tabs{display:flex; gap:6px; background:var(--surface-2); border-radius:12px; padding:4px; margin-bottom:20px;}
.auth-tab{
  flex:1; border:none; background:none; color:var(--ink-faint); font-weight:600; font-size:13px; padding:9px 8px;
  border-radius:9px; cursor:pointer; line-height:1.3;
}
.auth-tab .ar{display:block; font-size:11.5px; font-weight:500;}
.auth-tab.active{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(20,24,40,.12);}
.auth-row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px;}
.auth-foot{margin-top:16px; padding-top:14px; border-top:1px solid var(--border-soft); font-size:11.5px; color:var(--ink-faint); line-height:1.5;}

/* ---------- admin ---------- */
.adm-toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.adm-toolbar .search-box{min-width:200px;}
.role-tag{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:3px 9px; border-radius:100px; text-transform:uppercase;}
.role-tag.admin{background:var(--ai-soft); color:var(--ai);}
.role-tag.user{background:var(--cs-soft); color:var(--cs);}
.role-tag.builtin{background:var(--surface-3); color:var(--ink-soft); margin-inline-start:6px;}
.utable{min-width:0;}
.utable .u-name{font-weight:600;}
.utable .u-mail{font-size:12px; color:var(--ink-faint); word-break:break-all;}
.utable td.dim{color:var(--ink-soft); font-size:12.5px; white-space:nowrap;}
.row-acts{display:flex; gap:6px; flex-wrap:wrap;}
.act{
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft); border-radius:8px;
  padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.act:hover{color:var(--ink); border-color:var(--ink-faint);}
.act.danger:hover{color:var(--cyb-old); border-color:var(--cyb-old);}
@media (max-width:640px){
  .utable thead{display:none;}
  .utable, .utable tbody, .utable tr, .utable td{display:block; width:100%;}
  .utable tr{padding:12px 14px; border-bottom:1px solid var(--border);}
  .utable td{border:none; padding:3px 0;}
  .utable td[data-label]::before{content:attr(data-label) ": "; color:var(--ink-faint); font-size:11px; text-transform:uppercase; letter-spacing:.05em;}
  .utable td.dim{white-space:normal;}
  .utable td.acts-cell{padding-top:8px;}
}
.kv{display:grid; grid-template-columns:130px 1fr; gap:8px 14px; font-size:13.5px; margin:6px 0 4px;}
.kv dt{color:var(--ink-faint); font-size:12px; text-transform:uppercase; letter-spacing:.05em; padding-top:2px;}
.kv dd{margin:0; word-break:break-word;}
.panel-card{border:1px solid var(--border); border-radius:14px; background:var(--surface); box-shadow:var(--shadow); padding:20px;}
.panel-card h3{font-size:16px; margin-bottom:6px;}
.panel-card p{font-size:13px; color:var(--ink-soft); line-height:1.55; margin:0 0 14px;}
.panel-card + .panel-card{margin-top:14px;}

dialog#admDlg{
  border:1px solid var(--border); border-radius:16px; background:var(--surface); color:var(--ink);
  padding:22px 22px 18px; width:calc(100% - 32px); max-width:520px; box-shadow:0 24px 60px -20px rgba(0,0,0,.5);
}
dialog#admDlg::backdrop{background:rgba(10,12,24,.55);}
dialog#admDlg h2{font-size:18px; margin-bottom:14px;}
.dlg-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:6px; flex-wrap:wrap;}
.fld-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:520px){ .fld-2{grid-template-columns:1fr;} }

.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:50; max-width:calc(100% - 32px);
  background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:11px; font-size:13px; font-weight:600;
  box-shadow:var(--shadow);
}
.toast.err{background:var(--cyb-old); color:var(--on-accent);}
.audit-d{color:var(--ink-faint); font-size:12px;}

/* ============================= STATE ============================= */
var state = { view:'home', deptId:null, programId:null, tab:'full', openLevels:{}, levelSelect:null, search:'', reqFilter:'all', finderCode:null, mapCode:null };

function deptClass(d){ return d.id==='cs-dept' ? 'cs-dept' : (d.id==='nis-dept' ? 'nis-dept' : 'cis-dept'); }
function deptOf(id){ for (var i=0;i<DEPARTMENTS.length;i++) if (DEPARTMENTS[i].id===id) return DEPARTMENTS[i]; return null; }
function progDept(prog){ return deptOf(prog.dept); }
function totalCredits(prog){ var t=0; prog.courses.forEach(function(x){ t+=x.cr; }); return t; }
function levelsOf(prog){
  var m={};
  prog.courses.forEach(function(x){ (m[x.level]=m[x.level]||[]).push(x); });
  return m;
}
function findCourse(prog, code){
  for (var i=0;i<prog.courses.length;i++) if (prog.courses[i].code===code) return prog.courses[i];
  return null;
}
function esc(s){ return String(s==null?'':s).replace(/&(?!amp;|lt;|gt;|#39;|quot;)/g,'&amp;'); }

/* ============================= NAV ============================= */
function goHome(){ state.view='home'; state.deptId=null; state.programId=null; render(); }
function goDept(id){ state.view='dept'; state.deptId=id; render(); }
function goProgram(id, tab){
  state.view='program'; state.programId=id; state.tab=tab||'full'; state.search=''; state.reqFilter='all';
  state.finderCode=null; state.openLevels={}; state.levelSelect=null; state.mapCode=null;
  render();
}
function setTab(tab){ state.tab=tab; render(); }

document.getElementById('brandHome').addEventListener('click', goHome);
document.getElementById('brandHome').addEventListener('keydown', function(e){ if(e.key==='Enter') goHome(); });

/* ============================= THEME ============================= */
var themeState = 'auto'; // auto | light | dark
function applyTheme(){
  var root=document.documentElement;
  if(themeState==='auto'){ root.removeAttribute('data-theme'); document.getElementById('themeIcon').textContent='◐'; document.getElementById('themeLabel').textContent='Auto'; }
  else if(themeState==='light'){ root.setAttribute('data-theme','light'); document.getElementById('themeIcon').textContent='☀'; document.getElementById('themeLabel').textContent='Light'; }
  else { root.setAttribute('data-theme','dark'); document.getElementById('themeIcon').textContent='☾'; document.getElementById('themeLabel').textContent='Dark'; }
}
document.getElementById('themeToggle').addEventListener('click', function(){
  themeState = themeState==='auto' ? 'light' : themeState==='light' ? 'dark' : 'auto';
  applyTheme();
});
applyTheme();

function renderCrumbs(){
  var el = document.getElementById('crumbs');

  parts.push('<button data-nav="home">Home</button>');
  if(state.view==='dept'){
    var d = deptOf(state.deptId);
    parts.push('<span class="sep">/</span><span class="current">'+esc(d.short)+'</span>');
  } else if(state.view==='admin'){
    parts.push('<span class="sep">/</span><span class="current">User management</span>');

    parts.push('<span class="sep">/</span><button data-nav="dept" data-id="'+d2.id+'">'+esc(d2.short)+'</button>');
    parts.push('<span class="sep">/</span><span class="current">'+esc(prog.name)+'</span>');

  el.innerHTML = parts.join('');
  el.querySelectorAll('button[data-nav]').forEach(function(b){

  });
}

/* ---- full plan panel ---- */
function fullPlanHTML(prog){
  var html = '';
  html += '<div class="plan-controls">';
  html += '  <div class="search-box"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>';
  html += '  <input type="text" id="planSearch" placeholder="Search by code or title…" value="'+esc(state.search)+'"></div>';
  html += '  <div class="chip-filter">';
  html += '    <button class="chip'+(state.reqFilter==='all'?' active':'')+'" data-f="all">All</button>';
  html += '    <button class="chip'+(state.reqFilter==='R'?' active':'')+'" data-f="R">Required</button>';
  html += '    <button class="chip'+(state.reqFilter==='E'?' active':'')+'" data-f="E">Elective</button>';
  html += '  </div>';
  html += '</div>';

  var rows = filteredCourses(prog);
  html += '<div class="table-wrap"><table>';
  html += '<thead><tr><th style="width:52px;">Lvl</th><th>Code</th><th>Course title</th><th>Requisite</th><th>Prerequisite(s)</th><th style="width:60px;">Cr.</th><th>Category</th></tr></thead>';
  html += '<tbody>';
  if(rows.length===0){
    html += '<tr class="empty-row"><td colspan="7">No courses match your search.</td></tr>';
  } else {
    rows.forEach(function(x){
      html += '<tr>';
      html += '<td><span class="lvl-badge">'+x.level+'</span></td>';
      html += '<td class="code">'+esc(x.code)+'</td>';
      html += '<td>'+esc(x.title)+'</td>';
      html += '<td>'+reqTag(x.req)+'</td>';
      html += '<td class="prereq-cell">'+prereqCellHTML(prog, x)+'</td>';
      html += '<td class="credits">'+x.cr+'</td>';
      html += '<td style="color:var(--ink-faint); font-size:12.5px;">'+esc(x.cat)+'</td>';
      html += '</tr>';
    });
  }
  html += '</tbody></table></div>';
  return html;
}

function reqTag(req){
  return req==='R' ? '<span class="req-tag req">Required</span>' : '<span class="req-tag elec">Elective</span>';
}
function prereqCellHTML(prog, x){
  var parts=[];
  x.prereq.forEach(function(code){
    var hit = findCourse(prog, code);
    parts.push('<span class="prereq-code" data-goto="'+esc(code)+'" title="'+(hit? esc(hit.title):'Not listed in this plan')+'">'+esc(code)+'</span>');
  });
  var out = parts.length ? parts.join(' ') : '<span class="dash">—</span>';
  if(x.prereqNote) out += '<div style="margin-top:4px;font-size:11.5px;">'+esc(x.prereqNote)+'</div>';
  return out;
}

function filteredCourses(prog){
  var q = state.search.trim().toLowerCase();
  return prog.courses.filter(function(x){
    if(state.reqFilter!=='all' && x.req!==state.reqFilter) return false;
    if(!q) return true;
    return x.code.toLowerCase().indexOf(q)>-1 || x.title.toLowerCase().indexOf(q)>-1;
  });
}

function levelsHTML(prog){
  var byLevel = levelsOf(prog);
  var levels = Object.keys(byLevel).map(Number).sort(function(a,b){return a-b;});

  var html = '<div class="finder-shell">';
  html += '  <div class="finder-select-row">';
  html += '    <div class="select-wrap"><select id="levelSelect">';

    var rows = byLevel[lvl];

    html += '<option value="'+lvl+'"'+sel+'>Level '+lvl+' — '+rows.length+' course'+(rows.length===1?'':'s')+' · '+cr+' credit hours</option>';
  });

  html += '      <div class="result-meta"><span class="meta-tag">'+totalCr+' credit hours</span></div>';

  html += '    <div class="level-course-grid">';

    html += '<div class="course-pill">';
    html += '  <span class="cp-code">'+esc(x.code)+'</span>';
    html += '  <span class="cp-title">'+esc(x.title)+' '+reqTag(x.req)+'</span>';
    html += '  <span class="cp-cr">'+x.cr+' cr</span>';
    html += '</div>';
  });
  html += '    </div>';
  html += '  </div>';
  html += '</div>';
  return html;
}

/* ---- curriculum map panel ---- */
function buildMapLayout(prog){
  var byLevel = levelsOf(prog);
  var levels = Object.keys(byLevel).map(Number).sort(function(a,b){return a-b;});
  var COL_W=188, COL_GAP=64, NODE_H=52, ROW_GAP=10, TOP_PAD=40, SIDE_PAD=16, BOTTOM_PAD=16;
  var pos = {};
  var maxRows = 0;
  levels.forEach(function(lvl){ maxRows = Math.max(maxRows, byLevel[lvl].length); });
  levels.forEach(function(lvl, li){
    var x = SIDE_PAD + li*(COL_W+COL_GAP);
    byLevel[lvl].forEach(function(course, ri){
      var y = TOP_PAD + ri*(NODE_H+ROW_GAP);
      pos[course.code] = {x:x, y:y};
    });
  });
  var width = SIDE_PAD*2 + levels.length*COL_W + (levels.length-1)*COL_GAP;
  var height = TOP_PAD + maxRows*(NODE_H+ROW_GAP) - ROW_GAP + BOTTOM_PAD;
  return {pos:pos, levels:levels, byLevel:byLevel, width:width, height:height, COL_W:COL_W, COL_GAP:COL_GAP, SIDE_PAD:SIDE_PAD, NODE_H:NODE_H};
}

function ancestorsOf(prog, code){
  var result = {};
  function walk(c){
    var course = findCourse(prog, c);
    if(!course) return;
    course.prereq.forEach(function(p){
      if(findCourse(prog, p) && !result[p]){ result[p]=true; walk(p); }
    });
  }
  walk(code);
  return result;
}
function descendantsOf(prog, code){
  var result = {};
  function walk(c){
    prog.courses.forEach(function(x){
      if(x.prereq.indexOf(c)>-1 && !result[x.code]){ result[x.code]=true; walk(x.code); }
    });
  }
  walk(code);
  return result;
}

function mapHTML(prog){
  var layout = buildMapLayout(prog);
  var pos = layout.pos;
  var selected = state.mapCode && findCourse(prog, state.mapCode) ? state.mapCode : null;
  var ancestors = selected ? ancestorsOf(prog, selected) : {};
  var descendants = selected ? descendantsOf(prog, selected) : {};

  var html = '<div class="map-shell">';
  html += '  <div class="map-toolbar">';
  html += '    <div class="select-wrap"><select id="mapSelect"><option value="">Highlight a course…</option>';
  layout.levels.forEach(function(lvl){
    html += '<optgroup label="Level '+lvl+'">';
    layout.byLevel[lvl].forEach(function(x){
      var sel = (selected===x.code) ? ' selected' : '';
      html += '<option value="'+esc(x.code)+'"'+sel+'>'+esc(x.code)+' — '+esc(x.title)+'</option>';
    });
    html += '</optgroup>';
  });
  html += '    </select></div>';
  html += '    <button class="map-clear-btn" id="mapClear" type="button">Clear</button>';
  html += '  </div>';
  html += '  <div class="map-legend">';
  html += '    <span><i style="background:var(--cs)"></i> Prerequisite of the selected course</span>';
  html += '    <span><i style="background:var(--'+prog.accent+')"></i> Selected course</span>';
  html += '    <span><i style="background:var(--cyb)"></i> Unlocked by the selected course</span>';
  html += '  </div>';
  html += '  <div class="map-scroll"><div class="map-canvas" style="width:'+layout.width+'px; height:'+layout.height+'px;">';

  layout.levels.forEach(function(lvl, li){
    var x = layout.SIDE_PAD + li*(layout.COL_W+layout.COL_GAP);
    html += '<div class="map-col-label" style="left:'+x+'px; width:'+layout.COL_W+'px;">Level '+lvl+'</div>';
  });

  html += '<svg class="map-svg" width="'+layout.width+'" height="'+layout.height+'">';
  prog.courses.forEach(function(x){
    x.prereq.forEach(function(p){
      var sp = pos[p], tp = pos[x.code];
      if(!sp || !tp) return;
      var x1 = sp.x+layout.COL_W, y1 = sp.y+layout.NODE_H/2, x2 = tp.x, y2 = tp.y+layout.NODE_H/2;
      var dx = Math.max(36, (x2-x1)/2);
      var d = 'M'+x1+','+y1+' C'+(x1+dx)+','+y1+' '+(x2-dx)+','+y2+' '+x2+','+y2;
      var cls = 'map-edge';
      if(selected){
        var edgeUp = (x.code===selected || ancestors[x.code]) && (p===selected || ancestors[p]);
        var edgeDown = (p===selected || descendants[p]) && (x.code===selected || descendants[x.code]);
        if(edgeUp) cls += ' upstream';
        else if(edgeDown) cls += ' downstream';
        else cls += ' dimmed';
      }
      html += '<path class="'+cls+'" d="'+d+'"></path>';
    });
  });
  html += '</svg>';

  layout.levels.forEach(function(lvl){
    layout.byLevel[lvl].forEach(function(course){
      var p = pos[course.code];
      var ncls = 'map-node';
      if(selected){
        if(course.code===selected) ncls += ' selected';
        else if(ancestors[course.code]) ncls += ' upstream';
        else if(descendants[course.code]) ncls += ' downstream';
        else ncls += ' dimmed';
      }
      html += '<div class="'+ncls+'" data-code="'+esc(course.code)+'" style="left:'+p.x+'px; top:'+p.y+'px; width:'+layout.COL_W+'px; height:'+layout.NODE_H+'px;" title="'+esc(course.title)+' ('+course.cr+' credit hours)">';
      html += '  <div class="mn-code">'+esc(course.code)+'</div>';
      html += '  <div class="mn-title">'+esc(course.title)+'</div>';
      html += '</div>';
    });
  });

  html += '  </div></div>';
  html += '</div>';
  return html;
}

/* ============================= WIRING ============================= */
function wireCurrentPanel(prog){
  if(state.tab==='full'){
    var s = document.getElementById('planSearch');
    if(s){ s.addEventListener('input', function(){ state.search=s.value; renderProgramPanelOnly(prog); }); s.focus(); s.setSelectionRange(s.value.length,s.value.length); }
    document.querySelectorAll('.chip[data-f]').forEach(function(b){
      b.addEventListener('click', function(){ state.reqFilter=b.getAttribute('data-f'); renderProgramPanelOnly(prog); });
    });
    document.querySelectorAll('.prereq-code[data-goto]').forEach(function(el){
      el.addEventListener('click', function(){ jumpToPrereq(prog, el.getAttribute('data-goto')); });
    });
  } else if(state.tab==='levels'){
    var lsel = document.getElementById('levelSelect');
    if(lsel){ lsel.addEventListener('change', function(){ state.levelSelect = parseInt(lsel.value,10); renderProgramPanelOnly(prog); }); }
  } else if(state.tab==='finder'){
    var sel = document.getElementById('finderSelect');
    if(sel) sel.addEventListener('change', function(){ state.finderCode = sel.value || null; renderProgramPanelOnly(prog); });
    document.querySelectorAll('[data-goto]').forEach(function(el){
      el.addEventListener('click', function(){
        var code = el.getAttribute('data-goto');
        if(findCourse(prog, code)){ state.finderCode = code; renderProgramPanelOnly(prog); }
      });
    });
  } else if(state.tab==='map'){
    var msel = document.getElementById('mapSelect');
    if(msel){ msel.addEventListener('change', function(){ state.mapCode = msel.value || null; renderProgramPanelOnly(prog); }); }
    var mclear = document.getElementById('mapClear');
    if(mclear){ mclear.addEventListener('click', function(){ state.mapCode = null; renderProgramPanelOnly(prog); }); }
    document.querySelectorAll('.map-node[data-code]').forEach(function(el){
      el.addEventListener('click', function(){
        var code = el.getAttribute('data-code');
        state.mapCode = (state.mapCode===code) ? null : code;
        renderProgramPanelOnly(prog);
      });
    });
    var selNode = document.querySelector('.map-node.selected');
    if(selNode){ selNode.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'}); }
  }
}

function jumpToPrereq(prog, code){
  if(!findCourse(prog, code)) return;
  state.tab='finder'; state.finderCode=code;
  var host = document.getElementById('panelHost');
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab')==='finder'); });
  host.innerHTML = finderHTML(prog);
  wireCurrentPanel(prog);
}

function renderProgramPanelOnly(prog){
  var host = document.getElementById('panelHost');
  if(state.tab==='full') host.innerHTML = fullPlanHTML(prog);
  else if(state.tab==='levels') host.innerHTML = levelsHTML(prog);
  else if(state.tab==='map') host.innerHTML = mapHTML(prog);
  else host.innerHTML = finderHTML(prog);
  wireCurrentPanel(prog);
}

}

function thrCheck(key){ var t=thrAll()[key]; return (t&&t.lock&&t.lock>Date.now())? t.lock-Date.now() : 0; }
function thrFail(key,max,lockMs){
  var all=thrAll(), t=all[key]||{n:0};
  if(t.lock && t.lock<=Date.now()) t={n:0};
  t.n=(t.n||0)+1;
  if(t.n>=max){ t.lock=Date.now()+lockMs; t.n=0; }

var profile = null;         // cached Firestore profile for fbCurrentUser
var authReady = false;      // becomes true once onAuthStateChanged has fired at least once

function session(){
  if(!fbCurrentUser || !profile) return null;
  return { user: profile, role: profile.role, uid: fbCurrentUser.uid };
}
function sessMeta(){ return SS.get(K.sessmeta); }
function startSessionClock(){ SS.set(K.sessmeta, {iat:Date.now(), last:Date.now()}); }
function clearSessionClock(){ SS.del(K.sessmeta); }
var lastTouch=0;
function touch(){
  var now=Date.now(); if(now-lastTouch<15000) return; lastTouch=now;
  var m=sessMeta(); if(m && now-m.last<=CFG.idleMs){ m.last=now; SS.set(K.sessmeta,m); }
}
['click','keydown','touchstart','mousemove'].forEach(function(ev){ document.addEventListener(ev,touch,{passive:true}); });
setInterval(function(){
  if(!session()) return;
  var m=sessMeta(); var now=Date.now();
  if(!m || now-m.iat>CFG.absMs || now-m.last>CFG.idleMs){ notice='expired'; fbAuth.signOut(); }
},20000);
function requireAdmin(){ var s=session(); if(!s || s.role!=='admin') throw new Error('forbidden'); return s; }

/* After a successful Firebase sign-in, onAuthStateChanged (wired below) is the single
   place that fetches the profile and populates the module-level `profile` variable --
   the login forms wait for that to land instead of racing it with their own fetch, so
   there is exactly one render() driven by exactly one source of truth.
   `profileResolvedForUid` is deliberately separate from the one-time `authReady` boot
   flag: authReady only ever flips true->once (at the very first auth check) and must
   not be reused as a per-sign-in "is the profile fetch for THIS user done yet" signal,
   or a fresh sign-in reusing that stale `true` races its own pending profile fetch. */
var profileResolvedForUid = null;
function waitForOwnProfile(expectedUid, timeoutMs){
  timeoutMs = timeoutMs || 8000;
  var start = Date.now();
  return new Promise(function(resolve){
    (function check(){
      if(fbCurrentUser && fbCurrentUser.uid===expectedUid && profileResolvedForUid===expectedUid){ resolve(profile); return; }
      if(authReady && (!fbCurrentUser || fbCurrentUser.uid!==expectedUid) && Date.now()-start>300){ resolve(null); return; }
      if(Date.now()-start>timeoutMs){ resolve(null); return; }
      setTimeout(check,20);
    })();
  });
}

/* ---------- auth state wiring ---------- */
function wireAuthState(){
  fbAuth.onAuthStateChanged(function(user){
    booting = false;
    if(!user){ fbCurrentUser=null; profile=null; profileResolvedForUid=null; authReady=true; clearSessionClock(); render(); return; }
    fbCurrentUser = user;
    getProfile(user.uid).then(function(p){
      if(!p){
        // Signed in with Firebase, but no application profile -> not a recognised account
        // (covers a deleted account, or a stray sign-up). Sign out immediately.
        profile=null; profileResolvedForUid=user.uid; authReady=true;
        return fbAuth.signOut().then(function(){
          notice = 'unregistered'; render();
        });
      }
      profile = p; profileResolvedForUid=user.uid;
      if(!sessMeta()) startSessionClock();
      authReady = true;
      // best-effort last-login stamp; allowed by rules for the user's own doc
      profileRef(user.uid).update({ lastLogin: Date.now() }).catch(function(){});
      render();
    });
  });
}

  if(notice==='expired'){ setMsg(msg('warn','Your session ended. Please sign in again.','انتهت جلستك. يرجى تسجيل الدخول مرة أخرى.')); notice=null; }
  else if(notice==='out'){ setMsg(msg('ok','You have been signed out securely.','تم تسجيل الخروج بنجاح.')); notice=null; }
  else if(notice==='unregistered'){ setMsg(msg('warn','This account is no longer registered in the system. Please contact the system administrator.','هذا الحساب لم يعد مسجّلاً في النظام. يرجى التواصل مع مدير النظام.')); notice=null; }
  else if(notice==='fb-missing'){ setMsg(msg('err','This page is not yet connected to its account database. Please contact the system administrator.','لم يتم بعد ربط هذه الصفحة بقاعدة بيانات الحسابات. يرجى التواصل مع مدير النظام.')); notice=null; }
}
function paintStep(){

var EYE_OFF='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.49 18.49 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function pwToggle(inputId,btnId){
  var b=el(btnId); if(!b) return;
  function paint(visible){
    b.innerHTML = visible ? EYE_OFF : EYE_OPEN;
    b.setAttribute('aria-pressed', visible);
    var label = visible ? 'Hide password · إخفاء كلمة المرور' : 'Show password · إظهار كلمة المرور';
    b.setAttribute('aria-label', label); b.title = label;
  }
  paint(false);
  b.addEventListener('click',function(){ var i=el(inputId); var visible=i.type!=='password'; i.type=visible?'password':'text'; paint(!visible); });
}

/* Firebase sign-in error -> bilingual message. Modern Identity Platform often collapses
   "wrong password" and "no such account" into auth/invalid-credential to avoid leaking
   which emails are registered, so both are handled together. */
function authErrMsg(code){
  if(code==='auth/too-many-requests') return msg('err','Too many failed attempts. Please wait a few minutes and try again.','محاولات فاشلة كثيرة. يرجى الانتظار بضع دقائق ثم المحاولة مرة أخرى.');
  if(code==='auth/user-disabled') return msg('err','This account has been disabled.','تم تعطيل هذا الحساب.');
  if(code==='auth/network-request-failed') return msg('err','Network error. Please check your connection and try again.','خطأ في الشبكة. يرجى التحقق من الاتصال والمحاولة مرة أخرى.');
  return null; // fall back to caller's generic invalid-credentials message
}

function viewUserLogin(){

    '<div id="authMsg"></div>'+
    '<button class="btn primary block" type="submit" id="btnUserLogin">Sign in · دخول</button></form>';
}
function wireUserLogin(){
  var f=el('fUserLogin'); el('inUserEmail').focus(); pwToggle('inUserPw','btnPwShowU');
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    if(!fbReady){ setMsg(msg('err','This page is not yet connected to its account database. Please contact the system administrator.','لم يتم بعد ربط هذه الصفحة بقاعدة بيانات الحسابات. يرجى التواصل مع مدير النظام.')); return; }
    var email=normEmail(el('inUserEmail').value), pw=el('inUserPw').value, btn=el('btnUserLogin');
    ui.email=email;
    if(!email || !isEmail(email)){ setMsg(msg('warn','Please enter a valid email address.','يرجى إدخال عنوان بريد إلكتروني صحيح.')); return; }
    if(!inDomain(email)){ setMsg(msg('err','This email address is not accepted. Please use your official university email ending with '+DOMAIN+'.','عنوان البريد الإلكتروني غير مقبول. يرجى استخدام البريد الإلكتروني الجامعي المنتهي بـ '+DOMAIN+'.')); return; }
    if(!pw){ setMsg(msg('warn','Please enter your password.','يرجى إدخال كلمة المرور.')); return; }
    var k1='usr:'+email, k2='usr:*', lock=Math.max(thrCheck(k1),thrCheck(k2));
    if(lock){ setMsg(msg('err','Too many failed attempts. Sign-in is locked for '+mins(lock)+'.','محاولات فاشلة كثيرة. تم إيقاف الدخول لمدة '+mins(lock)+'.')); return; }
    busy(btn,true);
    fbAuth.signInWithEmailAndPassword(email,pw).then(function(cred){
      return waitForOwnProfile(cred.user.uid).then(function(p){
        if(!p || p.role!=='user'){
          return fbAuth.signOut().then(function(){
            busy(btn,false);
            if(p && p.role==='admin'){ setMsg(msg('info','This account has administrator privileges. Please use the Administrator tab.','هذا الحساب يملك صلاحيات مدير النظام. يرجى استخدام تبويب مدير النظام.')); }
            else { setMsg(msg('warn','This email is not registered in the system. Please contact the system administrator to add your account.','هذا البريد الإلكتروني غير مسجّل في النظام. يرجى التواصل مع مدير النظام لإضافة حسابك.')); }
          });
        }
        thrClear(k1); busy(btn,false);
        audit(p.email,'login.user',p.email,'');
        ui={tab:'user',email:''}; toast('Signed in successfully · تم تسجيل الدخول');
        render();
      });
    }).catch(function(e){
      busy(btn,false);
      // Not written to the shared audit log: at this point the browser never authenticated
      // with Firebase, so there is no signed-in identity Firestore's rules could check --
      // the local lockout below still fully protects against repeated guesses.
      var w1=thrFail(k1,CFG.maxLoginFails,CFG.lockMs), w2=thrFail(k2,CFG.maxGlobalFails,CFG.lockMs);
      var w=Math.max(w1,w2);
      var specific = authErrMsg(e && e.code);
      setMsg(w ? msg('err','Too many failed attempts. Sign-in is locked for '+mins(w)+'.','محاولات فاشلة كثيرة. تم إيقاف الدخول لمدة '+mins(w)+'.')
               : (specific || msg('err','Incorrect email or password.','البريد الإلكتروني أو كلمة المرور غير صحيحة.')));
      el('inUserPw').value=''; el('inUserPw').focus();
    });
  });
}

  var u=id?findCached(id):null; if(id && !u) return;
  var isNew=!u;
  dlg('<h2>'+(isNew?'Add user · إضافة مستخدم':'Edit user · تعديل مستخدم')+'</h2>'+
    '<form id="fUser" novalidate><div class="fld-2">'+
    '<label class="fld">'+lbl('First name','الاسم الأول')+'<input id="fFirst" type="text" maxlength="60" autocomplete="off" value="'+E(u?u.first:'')+'"></label>'+
    '<label class="fld">'+lbl('Last name','الاسم الأخير')+'<input id="fLast" type="text" maxlength="60" autocomplete="off" value="'+E(u?u.last:'')+'"></label></div>'+
    '<label class="fld">'+lbl('University email','البريد الجامعي')+'<input id="fEmailU" type="email" maxlength="120" autocomplete="off" autocapitalize="off" placeholder="name'+DOMAIN+'" value="'+E(u?u.email:'')+'"'+(isNew?'':' disabled')+'><span class="hint">'+(isNew?'Must end with '+DOMAIN:'The email cannot be changed here once the account exists.')+'</span></label>'+
    (isNew
      ? '<label class="fld">'+lbl('Password','كلمة المرور')+'<div class="pw-row"><input id="fPw" type="password" maxlength="128" autocomplete="new-password"><button class="btn" type="button" id="btnPwShow3" aria-pressed="false">Show</button></div><span class="hint">At least '+CFG.minPw+' characters, including a letter and a number.</span></label>'
      : '<div class="fld"><button class="btn" type="button" id="btnSendReset">Send password reset email · إرسال رابط إعادة تعيين كلمة المرور</button><span class="hint">The account owner will get an email with a link to set a new password themselves.</span></div>')+
    '<label class="fld">'+lbl('Role','الصلاحية')+'<select id="fRole"><option value="user"'+(u&&u.role==='user'||isNew?' selected':'')+'>User</option><option value="admin"'+(u&&u.role==='admin'?' selected':'')+'>Administrator</option></select></label>'+
    '<div id="dlgMsg"></div><div class="dlg-actions"><button class="btn" type="button" id="dlgCancel">Cancel</button><button class="btn primary" type="submit" id="dlgSave">'+(isNew?'Create user':'Save changes')+'</button></div></form>');
  if(isNew) pwToggle('fPw','btnPwShow3');
  el('fFirst').focus();
  el('dlgCancel').addEventListener('click',closeDlg);
  if(!isNew) el('btnSendReset').addEventListener('click',function(){
    var b=el('btnSendReset'); b.disabled=true;
    fbAuth.sendPasswordResetEmail(u.email).then(function(){
      var s=session(); audit(s.user.email,'password.reset-email',u.email,'');
      dlgMsg(msg('ok','A password reset email has been sent to '+u.email+'.','تم إرسال رسالة إعادة تعيين كلمة المرور إلى '+u.email+'.'));
    }).catch(function(){ b.disabled=false; dlgMsg(msg('err','Could not send the reset email.','تعذّر إرسال رسالة إعادة التعيين.')); });
  });
  el('fUser').addEventListener('submit',function(ev){
    ev.preventDefault();
    var data={first:el('fFirst').value.trim(), last:el('fLast').value.trim(), email:normEmail(el('fEmailU').value), pw:isNew?el('fPw').value:'', role:el('fRole').value};
    el('dlgSave').disabled=true;
    (isNew?opCreate(data):opUpdate(id,data)).then(function(){
      closeDlg(); toast(isNew?'User created · تم إنشاء المستخدم':'User updated · تم تحديث المستخدم'); paintUsersPanel();
    }).catch(function(e){ var b=el('dlgSave'); if(b) b.disabled=false; handleErr(e); });
  });
}
function openRoleConfirm(id){
  var u=findCached(id); if(!u) return; var toAdmin=u.role!=='admin';
  dlg('<h2>'+(toAdmin?'Promote to administrator':'Change to standard user')+'</h2><p style="font-size:13.5px;line-height:1.55;margin:0 0 14px">'+
    (toAdmin?E(fullName(u))+' will gain access to the admin panel. They sign in with the same password as before.':E(fullName(u))+' will lose access to the admin panel. They sign in with the same password as before.')+'</p>'+
    '<div id="dlgMsg"></div><div class="dlg-actions"><button class="btn" type="button" id="dlgCancel">Cancel</button><button class="btn primary" type="button" id="dlgOk">Confirm</button></div>');
  el('dlgCancel').addEventListener('click',closeDlg);
  el('dlgOk').addEventListener('click',function(){
    el('dlgOk').disabled=true;
    opRole(id,toAdmin?'admin':'user').then(function(){ closeDlg(); toast('Role updated · تم تحديث الصلاحية'); paintUsersPanel(); }).catch(function(e){ var b=el('dlgOk'); if(b) b.disabled=false; handleErr(e); });
  });
}
function openDelete(id){
  var u=findCached(id); if(!u) return;
  dlg('<h2>Delete account</h2><p style="font-size:13.5px;line-height:1.55;margin:0 0 14px">Permanently remove <b>'+E(fullName(u))+'</b> ('+E(u.email)+')’s access? This cannot be undone from here.</p>'+
    '<div id="dlgMsg"></div><div class="dlg-actions"><button class="btn" type="button" id="dlgCancel">Cancel</button><button class="btn danger" type="button" id="dlgOk">Delete</button></div>');
  el('dlgCancel').addEventListener('click',closeDlg);
  el('dlgOk').addEventListener('click',function(){
    el('dlgOk').disabled=true;
    opDelete(id).then(function(){ closeDlg(); toast('User deleted · تم حذف المستخدم'); paintUsersPanel(); }).catch(function(e){ var b=el('dlgOk'); if(b) b.disabled=false; handleErr(e); });
  });
}

/* operations: every one re-validates the admin session first */
function validateFields(d,isNew){
  if(!nameOk(d.first)||!nameOk(d.last)) throw uerr('Please enter a valid first and last name (letters only).','يرجى إدخال اسم أول وأخير صحيحين (أحرف فقط).');
  if(isNew && (!isEmail(d.email)||!inDomain(d.email))) throw uerr('The email must be a university email ending with '+DOMAIN+'.','يجب أن ينتهي البريد الإلكتروني بالنطاق '+DOMAIN+'.');
  if(d.role!=='admin'&&d.role!=='user') throw uerr('Invalid role.','صلاحية غير صحيحة.');
  if(isNew && !pwOk(d.pw)) throw uerr('The password must be at least '+CFG.minPw+' characters and include a letter and a number.','يجب ألا تقل كلمة المرور عن '+CFG.minPw+' أحرف وأن تحتوي على حرف ورقم.');
}
function opCreate(d){
  var s; try{ s=requireAdmin(); validateFields(d,true); }catch(e){ return Promise.reject(e); }
  // A secondary, independent Firebase App instance creates the new account so that the
  // administrator's own signed-in session (in the default app) is never touched.
  var secApp = firebase.apps.filter(function(a){return a.name==='Secondary';})[0] || firebase.initializeApp(FIREBASE_CONFIG,'Secondary');
  var secAuth = secApp.auth();
  return secAuth.createUserWithEmailAndPassword(d.email,d.pw).then(function(cred){
    var uid = cred.user.uid;
    return secAuth.signOut().then(function(){
      return profileRef(uid).set({ first:d.first, last:d.last, email:d.email, role:d.role, createdAt:Date.now(), createdBy:s.user.email, updatedAt:null, lastLogin:null });
    }).then(function(){
      audit(s.user.email,'user.create',d.email,'role='+d.role);
    });
  }).catch(function(e){
    if(e && e.code==='auth/email-already-in-use') throw uerr('An account with this email already exists.','يوجد حساب مسجّل بهذا البريد الإلكتروني.');
    if(e && e.userMsg) throw e;
    throw uerr('Could not create the account.','تعذّر إنشاء الحساب.');
  });
}
function opUpdate(id,d){
  var s; try{ s=requireAdmin(); }catch(e){ return Promise.reject(e); }
  var u=findCached(id); if(!u) return Promise.reject(uerr('This account cannot be edited.','لا يمكن تعديل هذا الحساب.'));
  try{ validateFields(d,false); }catch(e){ return Promise.reject(e); }
  if(u.id===s.uid && d.role!==u.role) return Promise.reject(uerr('You cannot change your own role.','لا يمكنك تغيير صلاحيتك بنفسك.'));
  var changed=[]; if(u.first!==d.first) changed.push('name'); if(u.last!==d.last) changed.push('name'); if(u.role!==d.role) changed.push('role');
  return profileRef(id).update({ first:d.first, last:d.last, role:d.role, updatedAt:Date.now() }).then(function(){
    audit(s.user.email,'user.update',u.email,changed.join(', ')||'no field changes');
  });
}
function opRole(id,role){
  var s; try{ s=requireAdmin(); }catch(e){ return Promise.reject(e); }
  var u=findCached(id); if(!u) return Promise.reject(uerr('This account cannot be changed.','لا يمكن تغيير هذا الحساب.'));
  if(u.id===s.uid) return Promise.reject(uerr('You cannot change your own role.','لا يمكنك تغيير صلاحيتك بنفسك.'));
  if(role!=='admin'&&role!=='user') return Promise.reject(uerr('Invalid role.','صلاحية غير صحيحة.'));
  return profileRef(id).update({ role:role, updatedAt:Date.now() }).then(function(){
    audit(s.user.email,'user.role',u.email,u.role+' → '+role);
  });
}
function opDelete(id){
  var s; try{ s=requireAdmin(); }catch(e){ return Promise.reject(e); }
  var u=findCached(id); if(!u) return Promise.reject(uerr('This account cannot be deleted.','لا يمكن حذف هذا الحساب.'));
  if(u.id===s.uid) return Promise.reject(uerr('You cannot delete your own account.','لا يمكنك حذف حسابك بنفسك.'));
  return profileRef(id).delete().then(function(){
    audit(s.user.email,'user.delete',u.email,'profile removed (the sign-in account itself must be removed from the Firebase console)');
  });
}

/* audit tab */
function paintAudit(){
  try{ requireAdmin(); }catch(e){ render(); return; }
  db.collection('audit').orderBy('t','desc').limit(200).get().then(function(snap){
    var a=[]; snap.forEach(function(d){ a.push(d.data()); });
    var h='<div class="table-wrap"><table class="utable"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>';
    if(!a.length) h+='<tr class="empty-row"><td colspan="5">No activity recorded yet.</td></tr>';
    a.forEach(function(r){
      h+='<tr><td class="dim" data-label="Time">'+fmt(r.t)+'</td><td data-label="Actor"><span class="u-mail" style="font-size:12.5px;color:var(--ink)">'+E(r.actor)+'</span></td><td data-label="Action">'+E(ACTION[r.action]||r.action)+'</td><td data-label="Target"><span class="u-mail">'+E(r.target)+'</span></td><td class="audit-d" data-label="Details">'+E(r.detail)+'</td></tr>';
    });
    h+='</tbody></table></div><p class="audit-d" style="margin-top:10px">Showing the latest '+a.length+' recorded events.</p>';
    el('admPanel').innerHTML=h;
  }).catch(function(){ el('admPanel').innerHTML=msg('err','Could not load the audit log.','تعذّر تحميل سجل الأنشطة.'); });
}

/* backup tab */
function paintBackup(){
  el('admPanel').innerHTML=
    '<div class="panel-card"><h3>Export users</h3><p>Download the current user list (names, emails, roles — no passwords are ever stored or exported). Accounts themselves live in Firebase, shared across every device.</p><button class="btn" id="btnExport" type="button">Download users.json</button></div>'+
    '<div class="panel-card"><h3>About accounts</h3><p>Accounts, roles and passwords are stored in this site’s Firebase project, so an account the administrator creates, or a password a user changes, works immediately from any computer or browser. To fully remove a deleted account’s ability to ever sign in again, also remove it from the Firebase console’s Authentication tab.</p></div>';
  el('btnExport').addEventListener('click',function(){
    var s; try{ s=requireAdmin(); }catch(e){ render(); return; }
    allProfiles().then(function(list){
      var blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),users:list},null,2)],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='users.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
      audit(s.user.email,'users.export','users.json',list.length+' accounts');
    });
  });
}

/* ---------- boot ---------- */
initFirebase();
if(fbReady){ wireAuthState(); }
else { booting=false; authReady=true; }

return {
  guard:function(){ return guardFirebase() && guard(); },
  renderAdmin:renderAdmin
};
})();

/* ============================= MASTER RENDER ============================= */
function render(){
  if(!Auth.guard()) return;          // no valid session -> sign-in screen, nothing else is rendered
  renderCrumbs();
  if(state.view==='home') renderHome();
  else if(state.view==='dept') renderDept();
  else if(state.view==='admin') Auth.renderAdmin();
  else renderProgram();
  window.scrollTo({top:0, behavior:'instant'});
}

render();
</script>
